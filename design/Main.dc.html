<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gothic+A1:wght@300;400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #9d3226; } a:hover { color: #6f2018; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #e7e7e6; color: #16181b; font-family: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,0.9) 0%, rgba(214,215,214,0) 70%); pointer-events: none;"></div>

  <!-- header -->
  <div style="padding: 30px 24px 16px; border-bottom: 1px solid #c3c4c3; position: relative;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px;">
      <div style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 25px; letter-spacing: 0.06em;">고운고등학교</div>
      <div style="font-size: 11px; letter-spacing: 0.18em; color: #7c7f80;">02:14</div>
    </div>
    <div style="display: flex; gap: 10px; align-items: center; margin-top: 9px; font-size: 11.5px; letter-spacing: 0.14em; color: #6d7072;">
      <span>괴담연구회</span>
      <span style="width: 1px; height: 10px; background: #b6b8b7;"></span>
      <span>셋째 날</span>
      <span style="width: 1px; height: 10px; background: #b6b8b7;"></span>
      <span style="color: #9d3226;">안개 짙음</span>
    </div>
  </div>

  <!-- investigation track -->
  <div style="padding: 20px 24px 18px; border-bottom: 1px solid #c3c4c3; position: relative;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px;">
      <div style="font-family: 'Nanum Myeongjo', serif; font-size: 14px; letter-spacing: 0.1em;">제3차 조사</div>
      <div style="font-size: 10.5px; letter-spacing: 0.16em; color: #7c7f80;">성공 1 · 실패 1</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;">
      <div style="height: 46px; border: 1px solid #16181b; background: #16181b; color: #e7e7e6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <span style="font-family: 'Nanum Myeongjo', serif; font-size: 15px;">1</span>
        <span style="font-size: 9px; letter-spacing: 0.1em;">성공</span>
      </div>
      <div style="height: 46px; border: 1px solid #9d3226; background: #9d3226; color: #f2eeed; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <span style="font-family: 'Nanum Myeongjo', serif; font-size: 15px;">2</span>
        <span style="font-size: 9px; letter-spacing: 0.1em;">실패</span>
      </div>
      <div style="height: 46px; border: 1px solid #16181b; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <span style="font-family: 'Nanum Myeongjo', serif; font-size: 15px;">3</span>
        <span style="font-size: 9px; letter-spacing: 0.1em; color: #6d7072;">진행</span>
      </div>
      <div style="height: 46px; border: 1px solid #c3c4c3; color: #8b8e8e; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: 'Nanum Myeongjo', serif; font-size: 15px;">4</span>
      </div>
      <div style="height: 46px; border: 1px solid #c3c4c3; color: #8b8e8e; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: 'Nanum Myeongjo', serif; font-size: 15px;">5</span>
      </div>
    </div>
  </div>

  <!-- chat -->
  <div style="flex-grow: 1; padding: 18px 24px 8px; display: flex; flex-direction: column; gap: 20px; overflow: hidden; position: relative;">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-family: 'Nanum Myeongjo', serif; font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em;">기록자</span>
        <span style="font-size: 9.5px; letter-spacing: 0.12em; color: #828585;">02:07</span>
      </div>
      <div style="font-size: 14px; line-height: 1.72; color: #2b2e31; text-wrap: pretty;">도서관 스크랩에서 그해 여름 기사만 잘려 나가 있었어. 누가 먼저 다녀갔다는 뜻이야.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-family: 'Nanum Myeongjo', serif; font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em;">감찰자</span>
        <span style="font-size: 9.5px; letter-spacing: 0.12em; color: #828585;">02:09</span>
      </div>
      <div style="font-size: 14px; line-height: 1.72; color: #2b2e31; text-wrap: pretty;">2차 조사에 들어간 세 명 중 하나겠지. 나는 그중 한 명을 이미 봤어.</div>
    </div>

    <div style="border-top: 1px solid #c3c4c3; border-bottom: 1px solid #c3c4c3; padding: 14px 0; display: flex; flex-direction: column; gap: 7px;">
      <div style="font-size: 9.5px; letter-spacing: 0.24em; color: #9d3226;">교내 방송</div>
      <div style="font-family: 'Nanum Myeongjo', serif; font-size: 15px; line-height: 1.66; letter-spacing: 0.01em;">“유민서 학생은 지금 즉시 방송실로 오십시오.”</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-family: 'Nanum Myeongjo', serif; font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; color: #9d3226;">나</span>
        <span style="font-size: 9.5px; letter-spacing: 0.12em; color: #828585;">02:12</span>
      </div>
      <div style="font-size: 14px; line-height: 1.72; color: #2b2e31; text-wrap: pretty;">그 이름을 부른 건 우리 중 누구도 아니야.</div>
    </div>

  </div>

  <!-- input -->
  <div style="padding: 10px 24px 12px; position: relative;">
    <div style="display: flex; align-items: center; gap: 12px; height: 48px; border: 1px solid #16181b; padding: 0 16px; background: #ededec;">
      <span style="flex-grow: 1; font-size: 13px; letter-spacing: 0.04em; color: #767979;">교실에 말하기</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16181b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </div>
  </div>

  <!-- tab bar -->
  <div style="border-top: 1px solid #16181b; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative; background: #e7e7e6;">
    <div style="height: 62px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #c3c4c3; background: #16181b; color: #e7e7e6; font-family: 'Nanum Myeongjo', serif; font-size: 13px; letter-spacing: 0.14em;">교실</div>
    <div style="height: 62px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #c3c4c3; font-family: 'Nanum Myeongjo', serif; font-size: 13px; letter-spacing: 0.14em; color: #55585a;">조사실</div>
    <div style="height: 62px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #c3c4c3; font-family: 'Nanum Myeongjo', serif; font-size: 13px; letter-spacing: 0.14em; color: #55585a;">원정</div>
    <div style="height: 62px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-size: 13px; letter-spacing: 0.14em; color: #55585a;">프로필</div>
  </div>

</div>
</x-dc>
</body>
</html>
