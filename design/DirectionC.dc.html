<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;500;900&family=Noto+Serif+KR:wght@600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #4bd396; } a:hover { color: #35a875; }
    @keyframes flicker {
      0%, 44%, 47%, 100% { opacity: 1; }
      45% { opacity: 0.28; }
      46% { opacity: 0.72; }
      78% { opacity: 0.55; }
      79% { opacity: 1; }
    }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #08090a; color: #b9c0c4; font-family: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif; display: flex; overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; background: radial-gradient(90% 55% at 50% 12%, rgba(120,140,150,0.13) 0%, rgba(8,9,10,0) 68%); pointer-events: none;"></div>

  <!-- 세로 복도 스트립 -->
  <div style="width: 46px; flex-shrink: 0; border-right: 1px solid #191d20; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 22px 0 18px; position: relative; background: #0b0d0e;">
    <div style="width: 22px; height: 3px; background: #d7dee1; box-shadow: 0 0 16px 3px rgba(215,222,225,0.5); animation: flicker 5.5s infinite steps(1, end);"></div>
    <div style="writing-mode: vertical-rl; font-family: 'Noto Serif KR', serif; font-size: 15px; letter-spacing: 0.42em; color: #737d82;">돌아오지&nbsp;않는&nbsp;밤</div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2ecc84" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h5v16h-5"></path><path d="M4 12h9"></path><path d="M9 8l4 4-4 4"></path></svg>
      <span style="font-size: 8px; letter-spacing: 0.16em; color: #2ecc84;">비상구</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;">

    <!-- header -->
    <div style="padding: 26px 20px 18px; position: relative;">
      <div style="font-size: 9.5px; letter-spacing: 0.3em; color: #5c666b;">고운고 · 본관 3 층</div>
      <div style="font-family: 'Gothic A1', sans-serif; font-weight: 900; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em; color: #e6ebed; margin-top: 8px;">교실</div>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px;">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #2ecc84; box-shadow: 0 0 10px 2px rgba(46,204,132,0.65);"></span>
        <span style="font-size: 11px; letter-spacing: 0.08em; color: #8b959a;">9 명 남아 있음 · 02:14</span>
      </div>
    </div>

    <!-- 조사 트랙 -->
    <div style="margin: 0 20px; padding: 14px 16px; background: #0e1113; border: 1px solid #1c2124; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 10.5px; letter-spacing: 0.2em; color: #7a8489;">3 차 조사</span>
        <span style="font-size: 10.5px; letter-spacing: 0.08em; color: #2ecc84;">인원 모집 중</span>
      </div>
      <div style="display: flex; gap: 7px; align-items: center;">
        <span style="flex-grow: 1; height: 4px; background: #2ecc84;"></span>
        <span style="flex-grow: 1; height: 4px; background: #c0392b;"></span>
        <span style="flex-grow: 1; height: 4px; background: #d7dee1; box-shadow: 0 0 12px 2px rgba(215,222,225,0.35);"></span>
        <span style="flex-grow: 1; height: 4px; background: #1c2124;"></span>
        <span style="flex-grow: 1; height: 4px; background: #1c2124;"></span>
      </div>
      <div style="font-size: 12.5px; line-height: 1.6; color: #97a1a6; text-wrap: pretty;">도서관 · 3 인 · 입장까지 <span style="color: #e6ebed;">04 : 51</span></div>
    </div>

    <!-- 채팅 -->
    <div style="flex-grow: 1; padding: 18px 20px 6px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">

      <div style="display: flex; gap: 10px; align-items: flex-start;">
        <div style="width: 30px; height: 30px; flex-shrink: 0; border: 1px solid #262c30; background: #121618; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #7a8489;">記</div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 10.5px; letter-spacing: 0.1em; color: #7a8489;">기록자</span>
          <div style="background: #12161a; border: 1px solid #1e2428; padding: 10px 13px; font-size: 13.5px; line-height: 1.62; color: #ccd3d7; text-wrap: pretty;">복도 끝 형광등이 아까부터 같은 박자로 꺼져. 세 번에 한 번씩.</div>
        </div>
      </div>

      <div style="display: flex; gap: 10px; align-items: flex-start;">
        <div style="width: 30px; height: 30px; flex-shrink: 0; border: 1px solid #262c30; background: #121618; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #7a8489;">監</div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 10.5px; letter-spacing: 0.1em; color: #7a8489;">감찰자</span>
          <div style="background: #12161a; border: 1px solid #1e2428; padding: 10px 13px; font-size: 13.5px; line-height: 1.62; color: #ccd3d7; text-wrap: pretty;">누가 스위치를 만지고 있다는 거잖아. 3 층엔 우리뿐인데.</div>
        </div>
      </div>

      <div style="border-left: 2px solid #c0392b; padding: 9px 0 9px 13px; display: flex; flex-direction: column; gap: 5px;">
        <span style="font-size: 9.5px; letter-spacing: 0.24em; color: #c0392b;">방송</span>
        <span style="font-family: 'Noto Serif KR', serif; font-size: 14px; line-height: 1.62; color: #e6ebed;">“유민서 학생은 지금 즉시 방송실로.”</span>
      </div>

      <div style="display: flex; justify-content: flex-end;">
        <div style="max-width: 78%; background: #1b2b24; border: 1px solid #24463a; padding: 10px 13px; font-size: 13.5px; line-height: 1.62; color: #d6e3dc; text-wrap: pretty;">방금 그거 스피커에서 난 소리 아니야.</div>
      </div>

    </div>

    <!-- 입력 -->
    <div style="padding: 8px 20px 12px;">
      <div style="display: flex; align-items: center; gap: 10px; height: 48px; border: 1px solid #242a2e; background: #0e1113; padding: 0 8px 0 16px;">
        <span style="flex-grow: 1; font-size: 13px; color: #5f696e;">교실에 말하기</span>
        <div style="width: 34px; height: 34px; background: #2ecc84; display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#08090a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"></path><path d="M12 6l6 6-6 6"></path></svg>
        </div>
      </div>
    </div>

    <!-- 탭 -->
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #191d20; background: #0b0d0e;">
      <div style="height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #e6ebed;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l8-5 8 5v9H4z"></path><path d="M9 19v-5h6v5"></path></svg>
        <span style="font-size: 9.5px; letter-spacing: 0.1em;">교실</span>
      </div>
      <div style="height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #5f696e;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.6-4.6"></path></svg>
        <span style="font-size: 9.5px; letter-spacing: 0.1em;">조사실</span>
      </div>
      <div style="height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #5f696e;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V6l7-2 7 2v13"></path><path d="M5 19h14"></path><path d="M12 4v15"></path></svg>
        <span style="font-size: 9.5px; letter-spacing: 0.1em;">원정</span>
      </div>
      <div style="height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #5f696e;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="3.4"></circle><path d="M5.5 19c1.2-3 3.7-4.5 6.5-4.5s5.3 1.5 6.5 4.5"></path></svg>
        <span style="font-size: 9.5px; letter-spacing: 0.1em;">프로필</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
